<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Requirements Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#E9ECF1; --rail:#F4F6F9; --paper:#FFFFFF; --ink:#1A2130; --ink-2:#4A5468; --ink-3:#7C8699;
  --line:#D6DBE4; --line-soft:#E7EAF0; --hover:#E3E7EE; --select:#D9E0FA;
  --prd:#2D4FD6; --prd-soft:#E4E9FC; --brd:#A96A12; --brd-soft:#F7ECD9; --blank:#5B6475; --blank-soft:#E8EAEF;
  --danger:#B42318; --ok:#1F7A4D;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --on-accent:#FFFFFF; --accent-lift:0%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#12161E; --rail:#171C26; --paper:#1D2330; --ink:#E7EAF1; --ink-2:#AEB6C6; --ink-3:#7D8698;
    --line:#2E3647; --line-soft:#262D3C; --hover:#252C3A; --select:#27335C;
    --prd:#8EA5FF; --prd-soft:#26305A; --brd:#E3AE5B; --brd-soft:#3B2E17; --blank:#A7AFBF; --blank-soft:#2A3140;
    --danger:#F47B6E; --ok:#5CC690; --on-accent:#12161E; --accent-lift:35%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#12161E; --rail:#171C26; --paper:#1D2330; --ink:#E7EAF1; --ink-2:#AEB6C6; --ink-3:#7D8698;
  --line:#2E3647; --line-soft:#262D3C; --hover:#252C3A; --select:#27335C;
  --prd:#8EA5FF; --prd-soft:#26305A; --brd:#E3AE5B; --brd-soft:#3B2E17; --blank:#A7AFBF; --blank-soft:#2A3140;
  --danger:#F47B6E; --ok:#5CC690; --on-accent:#12161E; --accent-lift:35%; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--prd);outline-offset:2px}

.app{display:grid;grid-template-columns:272px 1fr;height:100%}

/* Sidebar */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-head{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:-.01em}
.new-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:500}
.new-btn:hover{background:var(--hover)}
.search{margin:0 12px 10px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px 8px 32px;font-size:14px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.doc-list{flex:1;overflow-y:auto;padding:4px 8px 16px;list-style:none;margin:0}
.doc-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px}
.doc-item:hover{background:var(--hover)}
.doc-item[aria-current="true"]{background:var(--select)}
.doc-item .t{font-weight:500;font-size:14px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.doc-item .m{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.badge{flex:none;font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px;margin-top:1px;min-width:42px;text-align:center}
.badge.prd{background:var(--prd-soft);color:var(--prd)}
.badge.brd{background:var(--brd-soft);color:var(--brd)}
.badge.blank{background:var(--blank-soft);color:var(--blank)}
.rail-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.empty-list{padding:12px 10px;font-size:13.5px;color:var(--ink-3)}

/* Main */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--canvas);min-height:52px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;line-height:0}
.crumb{font-size:13.5px;color:var(--ink-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.save-state.err{color:var(--danger)}
.tb-btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13px;white-space:nowrap}
.tb-btn:hover{background:var(--hover)}
.tb-btn.danger{color:var(--danger)}
.tb-btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
select.status{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 8px;font-size:13px}

.scroller{flex:1;overflow-y:auto}
.sheet{max-width:860px;margin:28px auto 80px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-height:calc(100% - 108px)}
.sheet-head{padding:40px 64px 8px}
.title-input{width:100%;border:0;background:none;font-family:var(--head-font,var(--serif));font-size:34px;font-weight:600;letter-spacing:-.015em;line-height:1.2;padding:0}
.title-input::placeholder{color:var(--ink-3)}
.title-input:focus{outline:none}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px;font-size:13px;color:var(--ink-3)}

.toolbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line-soft);padding:8px 60px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.toolbar button{border:0;background:none;border-radius:6px;padding:6px 9px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;flex:none}
.toolbar button:hover{background:var(--hover);color:var(--ink)}
.toolbar button.on{background:var(--select);color:var(--ink)}
.toolbar .sep{width:1px;background:var(--line);margin:4px 6px;flex:none}

/* Document body */
.editor{padding:24px 64px 72px;outline:none;min-height:360px;font-size:16px;line-height:1.65;overflow-wrap:break-word}
.editor:empty::before{content:"Start writing, or type # for a heading, - for a list";color:var(--ink-3)}
.editor h1,.editor h2,.editor h3{font-family:var(--head-font,var(--serif));letter-spacing:-.01em;line-height:1.3}
.editor h1{font-size:26px;margin:1.4em 0 .4em}
.editor h2{font-size:21px;margin:1.6em 0 .4em;padding-bottom:.25em;border-bottom:1px solid var(--line-soft)}
.editor h3{font-size:17px;margin:1.3em 0 .3em}
.editor > :first-child{margin-top:0}
.editor p{margin:.5em 0}
.editor ul,.editor ol{padding-left:1.4em;margin:.5em 0}
.editor li{margin:.2em 0}
.editor blockquote{margin:1em 0;padding:10px 16px;border-left:3px solid var(--accent,var(--prd));background:var(--accent-soft,var(--prd-soft));border-radius:0 8px 8px 0;color:var(--ink)}
.editor hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.editor .tbl-wrap{overflow-x:auto;overflow-y:hidden;margin:1em 0;padding:9px 0 14px 9px}
.editor table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.editor th,.editor td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;min-width:48px;overflow-wrap:break-word}
.editor th{background:var(--rail);font-weight:600}

/* Table tools overlay: a fixed layer outside #editor, positioned over the live table with
   getBoundingClientRect(), so it never becomes part of the saved/exported HTML. */
#tblOverlay{position:fixed;inset:0;pointer-events:none;z-index:15}
#tblOverlay .tbl-ctrl{position:absolute;pointer-events:auto;box-sizing:border-box}
.tbl-grip{background:var(--line);border:0;border-radius:4px;cursor:pointer;padding:0;opacity:.5;transition:opacity .1s, background .1s;color:var(--ink-3);font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center}
.tbl-grip:hover{background:var(--ink-3);color:var(--paper);opacity:1}
.tbl-grip.col{height:9px;top:0}
.tbl-grip.row{width:9px;left:0}
.tbl-resize{width:7px;margin-left:-3.5px;cursor:col-resize;background:transparent;border:0;padding:0}
.tbl-resize:hover,.tbl-resize.active{background:var(--prd)}
.tbl-add{background:var(--paper);border:1px solid var(--line);border-radius:5px;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;opacity:.55;transition:opacity .1s}
.tbl-add:hover{background:var(--select);color:var(--ink);opacity:1}
.tbl-add.col{width:18px}
.tbl-add.row{height:18px}
.tbl-menu{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(20,24,34,.16);padding:4px;min-width:150px}
.tbl-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:6px;font-size:13px;color:var(--ink);white-space:nowrap}
.tbl-menu button:hover{background:var(--hover)}
.tbl-menu button.danger{color:var(--danger)}
.editor a{color:var(--accent-ink,var(--prd))}

/* Template picker */
.picker{max-width:920px;margin:0 auto;padding:48px 28px 80px}
.picker h1{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.picker p.lead{color:var(--ink-2);margin:0 0 32px;max-width:60ch}
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tpl{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s, transform .15s}
.tpl:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.tpl .cover{height:150px;padding:18px 18px 0;position:relative;overflow:hidden;border-bottom:1px solid var(--line-soft)}
.tpl.prd .cover{background:var(--prd-soft)}
.tpl.brd .cover{background:var(--brd-soft)}
.tpl.blank .cover{background:var(--blank-soft)}
.mini{background:var(--paper);border-radius:6px 6px 0 0;height:100%;padding:14px 14px 0;box-shadow:0 0 0 1px var(--line-soft)}
.mini i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:7px}
.mini i.h{height:9px;width:55%;margin-bottom:11px}
.tpl.prd .mini i.h{background:var(--prd)}
.tpl.brd .mini i.h{background:var(--brd)}
.tpl.blank .mini i.h{background:var(--blank);width:35%}
.mini i.s{width:32%;background:var(--ink-3);opacity:.5;margin-top:12px}
.tpl .body{padding:16px 18px 18px}
.tpl .name{font-family:var(--serif);font-weight:600;font-size:18px;margin-bottom:4px}
.tpl .desc{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.tpl .secs{font-size:12.5px;color:var(--ink-3);margin-top:10px;line-height:1.5}

/* Document look: accent, heading font and design theme */
.sheet{--accent:var(--blank);--head-font:var(--serif)}
.sheet[data-type="prd"]{--accent:var(--prd)}
.sheet[data-type="brd"]{--accent:var(--brd)}
.sheet{--accent-soft:color-mix(in srgb, var(--accent) 14%, var(--paper));--accent-ink:color-mix(in srgb, var(--accent), #fff var(--accent-lift))}
.sheet[data-design="modern"],.sheet[data-design="minimal"],.sheet[data-design="bold"],.sheet[data-design="corporate"]{--head-font:var(--sans)}
.sheet[data-font="serif"]{--head-font:var(--serif)}
.sheet[data-font="sans"]{--head-font:var(--sans)}
.sheet[data-font="mono"]{--head-font:var(--mono)}
.sheet[data-design="modern"] .title-input{font-weight:700;letter-spacing:-.025em}
.sheet[data-design="modern"] .editor h2{color:var(--accent-ink,var(--prd));border-bottom:0;padding-bottom:0;font-weight:700}
.sheet[data-design="modern"] .editor th{background:var(--accent-soft,var(--prd-soft))}
.sheet[data-design="minimal"] .title-input{font-weight:500}
.sheet[data-design="minimal"] .editor h2{font-size:18px;font-weight:600;border-bottom:0;padding-bottom:0;margin-top:2em}
.sheet[data-design="minimal"] .editor th,.sheet[data-design="minimal"] .editor td{border:0;border-bottom:1px solid var(--line-soft)}
.sheet[data-design="minimal"] .editor th{background:none;color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom-color:var(--line)}
.sheet[data-design="minimal"] .editor blockquote{background:none;border-left:2px solid var(--line);border-radius:0;color:var(--ink-2)}
.sheet[data-design="bold"] .title-input{font-weight:700}
.sheet[data-design="bold"] .editor h2{background:var(--accent);color:var(--on-accent);border:0;padding:7px 14px;border-radius:6px;font-size:19px}
.sheet[data-design="bold"] .editor th{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sheet[data-design="bold"] .editor blockquote{border-left-width:5px}
.sheet[data-design="corporate"]{--corp-band:color-mix(in srgb, var(--accent) 10%, var(--rail))}
.sheet[data-design="corporate"] .sheet-head{position:relative;padding-top:56px}
.sheet[data-design="corporate"] .sheet-head::before{content:"";position:absolute;top:0;left:0;right:0;height:40px;background:var(--corp-band,var(--rail));border-bottom:2px solid var(--accent,var(--prd))}
.sheet[data-design="corporate"]:has(.cover-band) .sheet-head::before{display:none}
.sheet[data-design="corporate"] .title-input{font-weight:500;letter-spacing:-.005em}
.sheet[data-design="corporate"] .editor h2{text-transform:uppercase;font-weight:500;letter-spacing:.01em;font-size:23px;color:var(--accent-ink,var(--prd));border-bottom:0;padding-bottom:0;margin-top:1.9em}
.sheet[data-design="corporate"] .editor h3{text-transform:uppercase;font-weight:600;letter-spacing:.08em;font-size:12px;color:var(--ink-3);margin:1.6em 0 .5em}
.sheet[data-design="corporate"] .editor th{background:var(--accent,var(--prd));color:var(--on-accent);text-transform:none;letter-spacing:0}
.sheet[data-design="corporate"] .editor td:first-child,.sheet[data-design="corporate"] .editor th:first-child{font-weight:600}
.sheet[data-design="corporate"] .editor blockquote{background:none;border-radius:0;border-left:3px solid var(--accent,var(--prd));font-style:italic;color:var(--ink-2)}

/* Cover banner */
.cover-band{position:relative;aspect-ratio:4/1;border-radius:11px 11px 0 0;overflow:hidden;background:var(--line-soft)}
.cover-band img{display:block;width:100%;height:100%;object-fit:cover}
.cover-edit{position:absolute;right:12px;bottom:12px;border:0;border-radius:8px;padding:6px 10px;font-size:12.5px;background:rgba(15,20,30,.66);color:#fff;opacity:0;transition:opacity .15s}
.cover-band:hover .cover-edit,.cover-edit:focus-visible{opacity:1}
@media (hover:none){ .cover-edit{opacity:1} }
.meta-link{border:0;background:none;padding:0;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.meta-link:hover{color:var(--ink)}

/* Cover and design step */
.custom{max-width:1120px;margin:0 auto;padding:36px 28px 80px}
.custom-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.custom h1{font-family:var(--serif);font-size:30px;font-weight:600;letter-spacing:-.015em;margin:0 0 6px}
.custom p.lead{color:var(--ink-2);margin:0;max-width:60ch}
.custom-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 14px;font-size:14px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.9;background:var(--ink)}
.custom-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.pv-wrap{position:sticky;top:20px}
.sheet.pv{margin:0;min-height:0;max-width:none;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pv .sheet-head{padding:28px 36px 4px}
.pv .title-input{font-size:28px}
.pv .editor{padding:16px 36px 36px;min-height:0;font-size:15px}
.opts{display:flex;flex-direction:column;gap:24px}
.opt h2{font:600 12px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:0 0 10px}
.opt .hint{font-size:12.5px;color:var(--ink-3);margin:8px 0 0}
.opt .hint.err{color:var(--danger)}
.cover-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cv{aspect-ratio:2.6/1;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv:hover{border-color:var(--ink-3)}
.cv.upload{border-style:dashed}
.cv[aria-pressed="true"]{outline:2px solid var(--prd);outline-offset:2px}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.th-card{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px 8px 10px;text-align:left}
.th-card:hover{border-color:var(--ink-3)}
.th-card[aria-pressed="true"]{border-color:var(--prd);box-shadow:0 0 0 1px var(--prd)}
.th-card .nm{font-weight:600;font-size:13.5px;margin:0 2px}
.th-card .ds{font-size:12px;color:var(--ink-3);line-height:1.4;margin:1px 2px 0}
.th-mock{height:66px;overflow:hidden;border-radius:6px;margin-bottom:8px;box-shadow:0 0 0 1px var(--line-soft);pointer-events:none}
.th-mock > .sheet{transform:scale(.42);transform-origin:0 0;width:238%}
.sheet.mini-sheet{margin:0;border:0;border-radius:0;min-height:0;max-width:none}
.mini-sheet .editor{padding:14px 20px;min-height:0;font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 10px 4px 6px;font-size:12.5px}
.pill[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pill .dot{width:16px;height:16px;border-radius:50%}
.pill input[type=color]{width:18px;height:18px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;border-right:1px solid var(--line-soft)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--select)}
.opts-foot{display:flex;gap:8px;justify-content:flex-end;padding-top:4px}

.loading{padding:60px;text-align:center;color:var(--ink-3)}
.scrim{display:none}

@media (max-width: 820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .app.drawer .rail{transform:none}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:rgba(10,14,22,.4);z-index:20}
  .menu-btn{display:inline-flex}
  .topbar{padding:8px 12px;flex-wrap:wrap}
  .sheet{margin:0;border-radius:0;border-left:0;border-right:0;min-height:100%}
  .sheet-head{padding:24px 20px 6px}
  .title-input{font-size:26px}
  .toolbar{padding:6px 14px}
  .editor{padding:18px 20px 60px}
  .tpl-grid{grid-template-columns:1fr}
  .tpl .cover{height:110px}
  .picker{padding:28px 18px 60px}
  .picker h1{font-size:26px}
  .hide-sm{display:none}
  .sheet:not(.pv) .cover-band{border-radius:0}
  .custom{padding:24px 16px 60px}
  .custom h1{font-size:25px}

/* ---------- Covers and designs ---------- */
// Preset covers are drawn on a canvas, so the editor and the PDF use the exact same image.
const COVER_W = 1600, COVER_H = 400;
function seeded(n){ return () => { n |= 0; n = n + 0x6D2B79F5 | 0; let t = Math.imul(n ^ n >>> 15, 1 | n); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function linear(c, x0, y0, x1, y1, stops){ const g = c.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => g.addColorStop(i/(stops.length-1), s)); return g; }
function glow(c, x, y, r, color){ const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)'); c.fillStyle = g; c.fillRect(0, 0, COVER_W, COVER_H); }

const COVERS = [
  { id:'horizon', name:'Horizon', draw(c, w, h){
      c.fillStyle = linear(c, 0, 0, w, h, ['#1E3A8A', '#4F46E5', '#A78BFA']); c.fillRect(0, 0, w, h);
      glow(c, w*.78, h*1.05, h*1.1, 'rgba(255,214,170,.8)'); } },
  { id:'dune', name:'Dune', draw(c, w, h){
      c.fillStyle = linear(c, 0, 0, 0, h, ['#FBE7C6', '#F4B976']); c.fillRect(0, 0, w, h);
      c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(w*.2, h*.36, h*.16, 0, Math.PI*2); c.fill();
      [['#EFA35A', .55], ['#D9803A', .7], ['#B8612A', .86]].forEach(([col, base], i) => {
        c.fillStyle = col; c.beginPath(); c.moveTo(0, h);
        for (let x = 0; x <= w; x += 20) c.lineTo(x, h*base + Math.sin(x/w*Math.PI*(1.5+i*.6) + i*1.3)*h*.08);
        c.lineTo(w, h); c.closePath(); c.fill(); }); } },
  { id:'grid', name:'Blueprint', draw(c, w, h){
      c.fillStyle = '#0F172A'; c.fillRect(0, 0, w, h);
      glow(c, w*.72, h*.15, h*1.3, 'rgba(56,189,248,.35)');
      const r = seeded(7); c.fillStyle = 'rgba(56,189,248,.22)';
      for (let x = 0; x < w; x += 40) for (let y = 0; y < h; y += 40) if (r() < .04) c.fillRect(x, y, 40, 40);
      c.strokeStyle = 'rgba(148,163,184,.16)'; c.lineWidth = 1; c.beginPath();
      for (let x = .5; x < w; x += 40){ c.moveTo(x, 0); c.lineTo(x, h); }
      for (let y = .5; y < h; y += 40){ c.moveTo(0, y); c.lineTo(w, y); }
      c.stroke(); } },
  { id:'waves', name:'Tide', draw(c, w, h){
      c.fillStyle = linear(c, 0, 0, w, 0, ['#0B4F4A', '#14B8A6']); c.fillRect(0, 0, w, h);
      c.lineWidth = 2;
      for (let i = 0; i < 14; i++){
        c.strokeStyle = `rgba(255,255,255,${.06 + i*.02})`; c.beginPath();
        for (let x = 0; x <= w; x += 10){ const y = h*(.12 + i*.058) + Math.sin(x/w*Math.PI*2.4 + i*.35)*h*.12; x ? c.lineTo(x, y) : c.moveTo(x, y); }
        c.stroke(); } } },
  { id:'blocks', name:'Blocks', draw(c, w, h){
      c.fillStyle = '#F3EFE7'; c.fillRect(0, 0, w, h);
      const r = seeded(21), pal = ['#2D4FD6', '#F2B544', '#E4572E', '#1F7A4D', '#1A2130'], s = 100;
      for (let x = 0; x < w; x += s) for (let y = 0; y < h; y += s){
        if (r() > .38) continue;
        c.fillStyle = pal[Math.floor(r()*pal.length)]; const k = r(); c.beginPath();
        if (k < .4) c.rect(x+8, y+8, s-16, s-16);
        else if (k < .7) c.arc(x+s/2, y+s/2, s/2-8, 0, Math.PI*2);
        else { const cx = x + (r() < .5 ? 8 : s-8), cy = y + (r() < .5 ? 8 : s-8); c.moveTo(cx, cy); c.arc(cx, cy, s-16, 0, Math.PI*2); c.save(); c.clip(); c.fillRect(x+8, y+8, s-16, s-16); c.restore(); continue; }
        c.fill(); } } },
  { id:'dots', name:'Meadow', draw(c, w, h){
      c.fillStyle = '#EAF2EA'; c.fillRect(0, 0, w, h); c.fillStyle = 'rgba(31,122,77,.55)';
      for (let x = 14; x < w; x += 28) for (let y = 14; y < h; y += 28){ const t = x/w; c.beginPath(); c.arc(x, y, 1.2 + 8*t*t*(.6 + .4*Math.sin(y/h*Math.PI)), 0, Math.PI*2); c.fill(); } } },
  { id:'mesh', name:'Bloom', draw(c, w, h){
      c.fillStyle = '#FFF1F2'; c.fillRect(0, 0, w, h);
      glow(c, w*.15, h*.2, h*1.3, 'rgba(244,114,182,.75)');
      glow(c, w*.55, h*.95, h*1.4, 'rgba(251,146,60,.7)');
      glow(c, w*.88, h*.1, h*1.2, 'rgba(139,92,246,.65)');
      glow(c, w*.4, h*.05, h*.8, 'rgba(56,189,248,.4)'); } },
  { id:'slate', name:'Slate', draw(c, w, h){
      c.fillStyle = linear(c, 0, 0, w, h, ['#3B4A61', '#1E2636']); c.fillRect(0, 0, w, h);
      c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 2; c.beginPath();
      for (let x = -h; x < w; x += 22){ c.moveTo(x, h); c.lineTo(x + h, 0); }
      c.stroke(); } }
];
const coverCache = {};
function coverSrc(cover){
  if (!cover) return null;
  if (cover.kind === 'image') return cover.src || null;
  const p = COVERS.find(x => x.id === cover.id); if (!p) return null;
  if (!coverCache[p.id]){
    const cv = document.createElement('canvas'); cv.width = COVER_W; cv.height = COVER_H;
    p.draw(cv.getContext('2d'), COVER_W, COVER_H);
    coverCache[p.id] = cv.toDataURL('image/jpeg', .9);
  }
  return coverCache[p.id];
}
const DEFAULT_COVER = { prd:{kind:'preset', id:'horizon'}, brd:{kind:'preset', id:'dune'}, blank:null };

const DESIGNS = {
  classic:  { name:'Classic',   desc:'Serif headings, ruled sections' },
  modern:   { name:'Modern',    desc:'Sans headings in the accent color' },
  minimal:  { name:'Minimal',   desc:'Quiet type, open tables' },
  bold:     { name:'Bold',      desc:'Solid section bands' },
  corporate:{ name:'Corporate', desc:'Letterhead header, uppercase labels, solid tables' }
};
const ACCENTS = [['#2D4FD6','Blue'], ['#A96A12','Amber'], ['#1F7A4D','Green'], ['#B42318','Red'], ['#7C3AED','Violet'], ['#0E7490','Teal'], ['#DB2777','Pink'], ['#334155','Slate']];
const FONTS = { serif:'Serif', sans:'Sans', mono:'Mono' };
const DEFAULT_DESIGN = { theme:'classic', accent:null, font:null };
const DEFAULT_THEME = { prd:'corporate', brd:'classic', blank:'classic' };

const isHex = v => typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v);
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i+2), 16));
const luminance = ([r, g, b]) => { const f = v => { v /= 255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }; return .2126*f(r) + .7152*f(g) + .0722*f(b); };
function lookOf(d){ const x = { ...DEFAULT_DESIGN, ...(d && d.design || {}) }; if (!DESIGNS[x.theme]) x.theme = 'classic'; if (!isHex(x.accent)) x.accent = null; if (!FONTS[x.font]) x.font = null; return x; }
// Attributes that apply a document's design to a .sheet element.
function sheetAttrs(type, design){
  let a = `data-type="${type}" data-design="${design.theme}"`;
  if (design.font) a += ` data-font="${design.font}"`;
  if (design.accent) a += ` style="--accent:${design.accent};--on-accent:${luminance(hexRgb(design.accent)) > .45 ? '#111' : '#fff'}"`;
  return a;
}

// Uploaded covers are center-cropped to the banner shape and stored as a compressed JPEG.
async function readCoverFile(file){
  if (!file || !/^image\//.test(file.type)) throw { code:'type' };
  if (file.size > 25*1024*1024) throw { code:'size' };
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const cv = document.createElement('canvas'); cv.width = COVER_W; cv.height = COVER_H;
    const c = cv.getContext('2d'), iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (!iw || !ih) throw { code:'read' };
    const k = Math.max(COVER_W/iw, COVER_H/ih);
    c.fillStyle = '#fff'; c.fillRect(0, 0, COVER_W, COVER_H);
    c.drawImage(img, (COVER_W - iw*k)/2, (COVER_H - ih*k)/2, iw*k, ih*k);
    return cv.toDataURL('image/jpeg', .82);
  }catch(e){ throw (e && e.code) ? e : { code:'read' }; }
  finally{ URL.revokeObjectURL(url); }
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function rel(ts){
  const s = (Date.now()-ts)/1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60)+' min ago';
  if (s < 86400) return Math.floor(s/3600)+' h ago';
  return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

/* ---------- Storage backends ---------- */
function withTimeout(p, ms){ return Promise.race([p, new Promise(r=>setTimeout(()=>r(null),ms))]); }
async function capability(name){
  try{ if (!window.claude || typeof window.claude.use!=='function') return null; return await withTimeout(window.claude.use(name), 10000); }catch(e){ return null; }
}

function dbBackend(db, userId){
  const col = db.collection('data/users/' + userId);
  return {
    note:'Saved to your account. Only you can see these documents.',
    start(cb){
      col.onSnapshot(snap => cb(snap.docs.filter(d=>d.exists).map(d => ({ ...d.data(), id:d.id }))),
        err => { setSave('Sync stopped. Reload the page to reconnect.', true); });
    },
    async save(doc){
      try{ await col.doc(doc.id).set(doc); }
      catch(e){
        if (e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r, 600+Math.random()*800)); await col.doc(doc.id).set(doc); }
        else throw e;
      }
    },
    remove(id){ return col.doc(id).delete(); }
  };
}
function localBackend(){
  const KEY='reqcomposer.docs.v1';
  let ok = true;
  const read = () => { try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ ok=false; return []; } };
  const all = new Map(read().map(d=>[d.id,d]));
  const write = () => { try{ localStorage.setItem(KEY, JSON.stringify([...all.values()])); }
    catch(e){ if (e && (e.name==='QuotaExceededError' || e.code===22)) throw {code:'quota_exceeded'}; ok=false; throw {code:'local'}; } };
  return {
    get note(){ return ok ? 'Saved in this browser only.' : 'Storage is off in this browser. Documents last until you close the page.'; },
    start(cb){ cb([...all.values()]); },
    async save(doc){ all.set(doc.id, doc); write(); },
    async remove(id){ all.delete(id); write(); }
  };
}

async function initStore(){
  const db = await capability('db');
  let userId = null;
  if (db){ const user = await capability('user'); try{ userId = user ? await user.id() : null; }catch(e){} }
  backend = (db && userId) ? dbBackend(db, userId) : localBackend();
  $('storeNote').textContent = backend.note;
  let first = true;
  backend.start(list => {
    mergeRemote(list);
    if (first){ first=false; state.view = state.docs.size ? 'doc' : 'picker';
      if (state.docs.size) state.currentId = sortedDocs()[0].id;
      render(); }
    else if (state.view==='picker' && !state.currentId && !pickedOnce && state.docs.size){ state.currentId = sortedDocs()[0].id; state.view='doc'; render(); }
    else renderList();
  });
  capability('downloads').then(d => {
    // Outside claude.ai there is no downloads capability: fall back to a normal browser download.
    if (!d && !window.claude) d = { save: async ({filename, data}) => {
      const blob = data instanceof Blob ? data : new Blob([data], {type:'text/markdown'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    } };
    downloads = d; $('exportBtn').style.display = d ? '' : 'none'; $('pdfBtn').style.display = (d && window.jspdf) ? '' : 'none'; });
}

function mergeRemote(list){
  const seen = new Set();
  for (const r of list){
    seen.add(r.id);
    const local = state.docs.get(r.id);
    const busy = writers[r.id] && (writers[r.id].busy || writers[r.id].pending);
    if (!local || (!busy && (r.updatedAt||0) > (local.updatedAt||0))){
      state.docs.set(r.id, r);
      if (r.id === state.currentId && state.view==='doc' && document.activeElement !== $('editor') && document.activeElement !== $('title')) renderDoc();
    }
  }
  for (const id of [...state.docs.keys()]){
    const busy = writers[id] && (writers[id].busy || writers[id].pending);
    if (!seen.has(id) && !busy && backend && !(backend.note||'').startsWith('Saved in this')) {
      state.docs.delete(id);
      if (id === state.currentId){ state.currentId=null; state.view = 'picker'; render(); }
    }
  }
}

function setSave(text, err){ const el=$('saveState'); el.textContent=text; el.classList.toggle('err', !!err); }

async function persist(doc){
  const w = writers[doc.id] || (writers[doc.id] = {busy:false, pending:null});
  w.pending = doc;
  if (w.busy) return;
  w.busy = true;
  setSave('Saving…');
  while (w.pending){
    const d = w.pending; w.pending = null;
    try{ await backend.save(d); setSave('Saved'); }
    catch(e){
      if (e && e.code==='quota_exceeded') setSave('Not saved: storage is full. Delete old documents.', true);
      else if (e && e.code==='local') setSave('Not saved: this browser blocks storage.', true);
      else setSave('Not saved. Check your connection and keep editing to retry.', true);
    }
  }
  w.busy = false;
}

let saveTimer = null;
function scheduleSave(){
  const doc = state.docs.get(state.currentId); if (!doc) return;
  doc.title = $('title').value;
  doc.html = $('editor').innerHTML;
  doc.updatedAt = Date.now();
  setSave('Editing…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer=null; persist({...doc}); renderList(); updateMeta(); }, 700);
}

/* ---------- Rendering ---------- */
function sortedDocs(){ return [...state.docs.values()].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); }

function renderList(){
  const q = state.query.trim().toLowerCase();
  const docs = sortedDocs().filter(d => !q || (d.title||'').toLowerCase().includes(q) || TEMPLATES[d.type].badge.toLowerCase().includes(q) || (d.html||'').replace(/<[^>]+>/g,' ').toLowerCase().includes(q));
  const ul = $('docList');
  if (!state.docs.size){ ul.innerHTML = '<li class="empty-list">No documents yet. Choose a template to start.</li>'; return; }
  if (!docs.length){ ul.innerHTML = '<li class="empty-list">No documents match your search.</li>'; return; }
  ul.innerHTML = docs.map(d => `<li><button class="doc-item" type="button" data-id="${d.id}" aria-current="${d.id===state.currentId && state.view==='doc'}">
    <span class="badge ${d.type}">${TEMPLATES[d.type].badge}</span>
    <span style="min-width:0"><span class="t">${esc(d.title||'Untitled')}</span><span class="m">${esc(d.status||'Draft')}, edited ${rel(d.updatedAt)}</span></span>
  </button></li>`).join('');
}

function render(){
  renderList();
  const actions = $('docActions');
  if (state.view !== 'doc') clearTableOverlay();
  if (state.view === 'picker'){ actions.style.display='none'; $('crumb').textContent='New document'; setSave(''); renderPicker(); }
  else if (state.view === 'doc'){ actions.style.display='inline-flex'; renderDoc(); }
  else if (state.view === 'design'){ actions.style.display='none'; $('crumb').textContent='Cover & design'; setSave(''); renderDesignPicker(); }
}

function renderPicker(){

      <div class="cover"><div class="mini">${lines}</div></div>
      <div class="body"><div class="name">${t.label}${key!=='blank'?` <span class="badge ${key}" style="vertical-align:3px;margin-left:4px">${t.badge}</span>`:''}</div>
      <div class="desc">${t.desc}</div><div class="secs">${t.secs}</div></div></button>`; };
  $('scroller').innerHTML = `<section class="picker">
    <h1>Start a document</h1>

function updateMeta(){
  const d = state.docs.get(state.currentId); const m = $('meta'); if (!d || !m) return;

/* ---------- Cover & design picker ---------- */
function openDesignPicker(){
  const d = state.docs.get(state.currentId); if (!d) return;
  flushSave();
  state.draft = { cover: d.cover ? { ...d.cover } : null, design: lookOf(d) };
  state.view = 'design'; render();
}

function draftDoc(){ const d = state.docs.get(state.currentId); return d ? { ...d, cover: state.draft.cover, design: state.draft.design } : null; }

function renderDesignPicker(){
  const d = state.docs.get(state.currentId); if (!d){ state.view='picker'; return render(); }
  const draft = draftDoc();
  const coverTile = (inner, id, pressed, extraClass) => `<button class="cv${extraClass?' '+extraClass:''}" type="button" data-cover="${id}" aria-pressed="${pressed}">${inner}</button>`;

      ${coverTile('Upload…', 'upload', draft.cover && draft.cover.kind==='image', 'upload')}

  const themeGrid = `<div class="theme-grid">${Object.entries(DESIGNS).map(([key, t]) => `
      <button class="th-card" type="button" data-theme="${key}" aria-pressed="${draft.design.theme===key}">
        <div class="th-mock"><article class="sheet mini-sheet" ${sheetAttrs(d.type, {...draft.design, theme:key})}>
          <div class="editor"><h2>Section title</h2><p>Sample body text for a quick look.</p></div>
        </article></div>
        <p class="nm">${t.name}</p><p class="ds">${t.desc}</p>
      </button>`).join('')}</div>`;
  const accentGrid = `<div class="swatches">
      <button class="sw" type="button" data-accent="" aria-pressed="${!draft.design.accent}" title="Default" style="background:var(--${d.type==='brd'?'brd':d.type==='prd'?'prd':'blank'})"></button>
      ${ACCENTS.map(([hex, name]) => `<button class="sw" type="button" data-accent="${hex}" aria-pressed="${draft.design.accent===hex}" title="${name}" style="background:${hex}"></button>`).join('')}
      <label class="pill" aria-pressed="${draft.design.accent && !ACCENTS.some(a=>a[0]===draft.design.accent) ? 'true':'false'}">
        <span class="dot" id="customDot" style="background:${isHex(draft.design.accent) && !ACCENTS.some(a=>a[0]===draft.design.accent) ? draft.design.accent : '#fff'};box-shadow:0 0 0 1px var(--line) inset"></span>Custom
        <input type="color" id="accentCustom" value="${isHex(draft.design.accent)?draft.design.accent:'#2D4FD6'}" aria-label="Custom accent color">

    </div>`;
  $('scroller').innerHTML = `<section class="custom">
    <div class="custom-head">
      <div><h1>Cover & design</h1><p class="lead">Pick a cover image and a look for this document. Changes apply only when you save.</p></div>
      <div class="custom-actions"><button class="btn" type="button" id="designCancel">Cancel</button><button class="btn primary" type="button" id="designSave">Save</button></div>
    </div>
    <div class="custom-grid">
      <div class="pv-wrap"><article class="sheet pv" id="pvSheet" ${sheetAttrs(d.type, draft.design)}>
        ${coverSrc(draft.cover) ? `<div class="cover-band"><img id="pvCover" src="${coverSrc(draft.cover)}" alt=""></div>` : ''}
        <div class="sheet-head"><input class="title-input" value="${esc(d.title||'Untitled')}" readonly tabindex="-1" aria-hidden="true"></div>
        <div class="editor">${d.html || '<p>Your document content will look like this.</p>'}</div>
      </article></div>

        <div class="opt"><h2>Cover image</h2>${coverGrid}</div>
        <div class="opt"><h2>Design theme</h2>${themeGrid}</div>
        <div class="opt"><h2>Accent color</h2>${accentGrid}</div>
        <div class="opt"><h2>Heading font</h2>${fontSeg}</div>
        <div class="opts-foot hide-sm"><button class="btn" type="button" id="designCancel2">Cancel</button><button class="btn primary" type="button" id="designSave2">Save</button></div>
      </div>

}

function refreshDesignPreview(){
  const d = state.docs.get(state.currentId); const draft = state.draft; if (!d || !draft) return;
  const pv = $('pvSheet'); if (!pv) return;
  pv.setAttribute('data-design', draft.design.theme);
  if (draft.design.font) pv.setAttribute('data-font', draft.design.font); else pv.removeAttribute('data-font');
  if (draft.design.accent) pv.style.setProperty('--accent', draft.design.accent), pv.style.setProperty('--on-accent', luminance(hexRgb(draft.design.accent)) > .45 ? '#111' : '#fff');
  else { pv.style.removeProperty('--accent'); pv.style.removeProperty('--on-accent'); }
  let band = pv.querySelector('.cover-band'); const src = coverSrc(draft.cover);
  if (src){ if (!band){ band = document.createElement('div'); band.className = 'cover-band'; band.innerHTML = '<img id="pvCover" alt="">'; pv.prepend(band); } band.querySelector('img').src = src; }
  else if (band) band.remove();
}

function setCoverHint(text, err){ const h = $('coverHint'); if (h){ h.textContent = text||''; h.classList.toggle('err', !!err); } }

function bindDesignPicker(){
  const scroller = $('scroller');
  scroller.querySelectorAll('.cv[data-cover]').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.cover;
    if (id === 'upload'){ $('coverFile').click(); return; }
    state.draft.cover = id === 'none' ? null : { kind:'preset', id };
    renderDesignPicker();
  }));
  const file = $('coverFile');
  if (file) file.addEventListener('change', async () => {
    const f = file.files && file.files[0]; file.value=''; if (!f) return;
    setCoverHint('Reading image…');
    try{ const src = await readCoverFile(f); state.draft.cover = { kind:'image', src }; renderDesignPicker(); }
    catch(e){
      if (e && e.code==='type') setCoverHint('Please choose an image file.', true);
      else if (e && e.code==='size') setCoverHint('That image is larger than 25 MB. Choose a smaller file.', true);
      else setCoverHint('Couldn’t read that image. Try another file.', true);
    }
  });
  scroller.querySelectorAll('.th-card[data-theme]').forEach(btn => btn.addEventListener('click', () => {
    state.draft.design = { ...state.draft.design, theme: btn.dataset.theme };
    scroller.querySelectorAll('.th-card').forEach(b => b.setAttribute('aria-pressed', b===btn));
    refreshDesignPreview();
  }));
  scroller.querySelectorAll('[data-accent]').forEach(btn => btn.addEventListener('click', () => {
    state.draft.design = { ...state.draft.design, accent: btn.dataset.accent || null };
    scroller.querySelectorAll('[data-accent]').forEach(b => b.setAttribute('aria-pressed', b===btn));
    scroller.querySelector('label.pill').setAttribute('aria-pressed', 'false');
    refreshDesignPreview();
  }));
  const custom = $('accentCustom');
  if (custom) custom.addEventListener('input', () => {
    state.draft.design = { ...state.draft.design, accent: custom.value };
    scroller.querySelectorAll('[data-accent]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    scroller.querySelector('label.pill').setAttribute('aria-pressed', 'true');
    $('customDot').style.background = custom.value;
    refreshDesignPreview();
  });
  scroller.querySelectorAll('[data-font]').forEach(btn => btn.addEventListener('click', () => {
    state.draft.design = { ...state.draft.design, font: btn.dataset.font || null };
    scroller.querySelectorAll('[data-font]').forEach(b => b.setAttribute('aria-pressed', b===btn));
    refreshDesignPreview();
  }));
  const back = () => { state.view='doc'; state.draft=null; render(); };
  ['designCancel','designCancel2'].forEach(id => { const b = $(id); if (b) b.addEventListener('click', back); });
  const save = () => {
    const d = state.docs.get(state.currentId); if (!d) return back();
    d.cover = state.draft.cover; d.design = state.draft.design; d.updatedAt = Date.now();
    persist({...d}); state.view='doc'; state.draft=null; render();
  };
  ['designSave','designSave2'].forEach(id => { const b = $(id); if (b) b.addEventListener('click', save); });
}

/* ---------- Editor ---------- */
function bindEditor(){
  const ed = $('editor'), title = $('title');
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}
  title.addEventListener('input', () => { scheduleSave(); });
  title.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); ed.focus(); } });
  ed.addEventListener('input', scheduleSave);
  ed.addEventListener('input', e => { if (e.target.closest && e.target.closest('table')) debounceRelayout(); });
  ed.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  ed.addEventListener('keydown', markdownShortcut);
  $('toolbar').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
  $('toolbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (document.activeElement !== ed) ed.focus();
    if (b.dataset.block) document.execCommand('formatBlock', false, '<'+b.dataset.block+'>');
    else if (b.dataset.cmd) document.execCommand(b.dataset.cmd);
    else if (b.dataset.insert==='hr') document.execCommand('insertHTML', false, '<hr><p><br></p>');
    else if (b.dataset.insert==='table') document.execCommand('insertHTML', false, '<div class="tbl-wrap"><table><thead><tr><th>Column</th><th>Column</th><th>Column</th></tr></thead><tbody><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table></div><p><br></p>');
    else if (b.dataset.insert==='row') addRow();
    if (b.dataset.insert==='table') relayoutTables();
    scheduleSave(); syncToolbar();
  });
  document.addEventListener('selectionchange', syncToolbar);
  initTableTools();
}

function addRow(){
  const sel = getSelection(); if (!sel.rangeCount) return;
  let n = sel.anchorNode; n = n && (n.nodeType===1 ? n : n.parentElement);
  const tr = n && n.closest('tr'); if (!tr || !$('editor').contains(tr)){ setSave('Place the cursor in a table row first.'); return; }
  const row = document.createElement('tr');
  row.innerHTML = [...tr.children].map(()=>'<td><br></td>').join('');
  if (tr.parentElement.tagName==='THEAD'){ const tb = tr.closest('table').tBodies[0] || tr.closest('table').createTBody(); tb.insertBefore(row, tb.firstChild); }
  else tr.after(row);
  relayoutTables();
}

/* ---------- Table tools: Notion-style grips, resize, insert/delete row & column ----------
   Controls live in a fixed overlay outside #editor (positioned from getBoundingClientRect),
   so they are never part of editor.innerHTML and never touch saved HTML, Markdown or PDF export. */
function tblOverlay(){
  let el = document.getElementById('tblOverlay');
  if (!el){ el = document.createElement('div'); el.id = 'tblOverlay'; document.body.appendChild(el); }
  return el;
}
function clearTableOverlay(){ const el = document.getElementById('tblOverlay'); if (el) el.innerHTML = ''; }
function closeTableMenu(){ tblOverlay().querySelectorAll('.tbl-menu').forEach(m => m.remove()); }

function rowEls(table){ return [...table.querySelectorAll(':scope > thead > tr, :scope > tbody > tr')]; }
function colCount(table){ const r = table.querySelector('tr'); return r ? r.children.length : 0; }

function ensureColgroup(table){
  let cg = table.querySelector(':scope > colgroup');
  if (!cg){
    const firstRow = table.querySelector('tr'); if (!firstRow) return null;
    cg = document.createElement('colgroup');
    [...firstRow.children].forEach(c => { const col = document.createElement('col'); col.style.width = Math.max(48, Math.round(c.getBoundingClientRect().width)) + 'px'; cg.appendChild(col); });
    table.insertBefore(cg, table.firstChild);
    resizeTableToColumns(table);
  }
  return cg;
}
function resizeTableToColumns(table){
  const cg = table.querySelector(':scope > colgroup'); if (!cg) return;
  table.style.tableLayout = 'fixed';
  table.style.width = [...cg.children].reduce((a,c) => a + (parseFloat(c.style.width) || 120), 0) + 'px';
}

function insertRowAt(table, refRow, where){ // where: 'before' | 'after'
  const n = colCount(table);
  const tag = refRow.parentElement.tagName === 'THEAD' ? 'th' : 'td';
  const tr = document.createElement('tr');
  for (let i=0;i<n;i++){ const c = document.createElement(tag); c.innerHTML = '<br>'; tr.appendChild(c); }
  if (refRow.parentElement.tagName === 'THEAD' && where === 'after'){
    const tb = table.tBodies[0] || table.createTBody(); tb.insertBefore(tr, tb.firstChild);
  } else if (where === 'before') refRow.before(tr); else refRow.after(tr);
  return tr;
}
function deleteRow(table, row){ if (rowEls(table).length > 1) row.remove(); }

function insertColumnAt(table, index){
  ensureColgroup(table);
  const cg = table.querySelector(':scope > colgroup');
  const col = document.createElement('col'); col.style.width = '120px';
  cg.insertBefore(col, cg.children[index] || null);
  rowEls(table).forEach(row => {
    const tag = row.parentElement.tagName === 'THEAD' ? 'th' : 'td';
    const cell = document.createElement(tag); cell.innerHTML = '<br>';
    row.insertBefore(cell, row.children[index] || null);
  });
  resizeTableToColumns(table);
}
function deleteColumnAt(table, index){
  const cg = table.querySelector(':scope > colgroup');
  if (!cg || cg.children.length <= 1) return;
  if (cg.children[index]) cg.children[index].remove();
  rowEls(table).forEach(row => { if (row.children[index]) row.children[index].remove(); });
  resizeTableToColumns(table);
}

function openRowMenu(table, row, anchorRect){
  closeTableMenu();
  const menu = document.createElement('div'); menu.className = 'tbl-ctrl tbl-menu';
  menu.innerHTML = `<button type="button" data-act="before">Insert row above</button><button type="button" data-act="after">Insert row below</button><button type="button" data-act="del" class="danger">Delete row</button>`;
  menu.style.left = anchorRect.left + 'px'; menu.style.top = (anchorRect.bottom + 4) + 'px';
  tblOverlay().appendChild(menu);
  menu.addEventListener('click', e => {
    const act = e.target.dataset.act; if (!act) return;
    if (act === 'del') deleteRow(table, row); else insertRowAt(table, row, act);
    closeTableMenu(); relayoutTables(); scheduleSave();
  });
}
function openColMenu(table, index, anchorRect){
  closeTableMenu();
  const menu = document.createElement('div'); menu.className = 'tbl-ctrl tbl-menu';
  menu.innerHTML = `<button type="button" data-act="left">Insert column left</button><button type="button" data-act="right">Insert column right</button><button type="button" data-act="del" class="danger">Delete column</button>`;
  menu.style.left = anchorRect.left + 'px'; menu.style.top = (anchorRect.bottom + 4) + 'px';
  tblOverlay().appendChild(menu);
  menu.addEventListener('click', e => {
    const act = e.target.dataset.act; if (!act) return;
    if (act === 'left') insertColumnAt(table, index);
    else if (act === 'right') insertColumnAt(table, index + 1);
    else deleteColumnAt(table, index);
    closeTableMenu(); relayoutTables(); scheduleSave();
  });
}

function startColResize(e, table, col){
  e.preventDefault(); e.stopPropagation();
  const startWidth = parseFloat(col.style.width) || col.getBoundingClientRect().width;
  const startX = e.clientX;
  e.currentTarget.classList.add('active');
  function onMove(ev){
    col.style.width = Math.max(48, Math.round(startWidth + (ev.clientX - startX))) + 'px';
    resizeTableToColumns(table); relayoutTables();
  }
  function onUp(){ document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); scheduleSave(); }
  document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
}

function relayoutTables(){
  const ed = $('editor');
  clearTableOverlay();
  if (state.view !== 'doc' || !ed) return;
  const wraps = [...ed.querySelectorAll('.tbl-wrap')];
  if (!wraps.length) return;
  const layer = tblOverlay();
  const frag = document.createDocumentFragment();
  wraps.forEach(wrap => {
    const table = wrap.querySelector(':scope > table'); if (!table) return;
    ensureColgroup(table);
    const cg = table.querySelector(':scope > colgroup'); if (!cg) return;
    const rows = rowEls(table); if (!rows.length) return;
    const headCells = [...rows[0].children];
    const tRect = table.getBoundingClientRect();
    const mk = (cls) => { const el = document.createElement('button'); el.type = 'button'; el.className = 'tbl-ctrl ' + cls; return el; };
    headCells.forEach((cell, i) => {
      const r = cell.getBoundingClientRect();
      const grip = mk('tbl-grip col'); grip.title = 'Column options'; grip.textContent = '⋯';
      grip.style.left = r.left + 'px'; grip.style.width = r.width + 'px'; grip.style.top = (tRect.top - 11) + 'px';
      grip.addEventListener('click', ev => openColMenu(table, i, ev.currentTarget.getBoundingClientRect()));
      frag.appendChild(grip);
      const rz = mk('tbl-resize'); rz.style.left = r.right + 'px'; rz.style.top = tRect.top + 'px'; rz.style.height = tRect.height + 'px';
      rz.addEventListener('mousedown', ev => startColResize(ev, table, cg.children[i]));
      frag.appendChild(rz);
    });
    const lastCell = headCells[headCells.length - 1].getBoundingClientRect();
    const addCol = mk('tbl-add col'); addCol.title = 'Insert column'; addCol.textContent = '+';
    addCol.style.left = (lastCell.right + 4) + 'px'; addCol.style.top = tRect.top + 'px'; addCol.style.height = tRect.height + 'px';
    addCol.addEventListener('click', () => { insertColumnAt(table, colCount(table)); relayoutTables(); scheduleSave(); });
    frag.appendChild(addCol);
    rows.forEach((row, i) => {
      const r = row.getBoundingClientRect();
      const grip = mk('tbl-grip row'); grip.title = 'Row options'; grip.textContent = '⋮';
      grip.style.top = r.top + 'px'; grip.style.height = r.height + 'px'; grip.style.left = (tRect.left - 11) + 'px';
      grip.addEventListener('click', ev => openRowMenu(table, row, ev.currentTarget.getBoundingClientRect()));
      frag.appendChild(grip);
    });
    const lastRow = rows[rows.length - 1].getBoundingClientRect();
    const addRowBtn = mk('tbl-add row'); addRowBtn.title = 'Insert row'; addRowBtn.textContent = '+';
    addRowBtn.style.top = (lastRow.bottom + 4) + 'px'; addRowBtn.style.left = tRect.left + 'px'; addRowBtn.style.width = tRect.width + 'px';
    addRowBtn.addEventListener('click', () => { insertRowAt(table, rows[rows.length - 1], 'after'); relayoutTables(); scheduleSave(); });
    frag.appendChild(addRowBtn);
  });
  layer.appendChild(frag);
}

let tableLayoutTimer = null;
function debounceRelayout(){ clearTimeout(tableLayoutTimer); tableLayoutTimer = setTimeout(relayoutTables, 120); }

let tableToolsInstalled = false;
function initTableTools(){
  relayoutTables();
  if (tableToolsInstalled) return;
  tableToolsInstalled = true;
  window.addEventListener('resize', debounceRelayout);
  window.addEventListener('scroll', debounceRelayout, true); // capture: also catches .scroller / .tbl-wrap scrolling
  document.addEventListener('mousedown', e => { if (!e.target.closest('.tbl-menu')) closeTableMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTableMenu(); });
}

function syncToolbar(){
  const tb = $('toolbar'), ed = $('editor'); if (!tb || !ed) return;
  const sel = getSelection(); if (!sel.rangeCount || !ed.contains(sel.anchorNode)) return;
  let block = ''; try{ block = (document.queryCommandValue('formatBlock')||'').toLowerCase(); }catch(e){}
  tb.querySelectorAll('button').forEach(b => {
    let on = false;
    try{
      if (b.dataset.cmd) on = document.queryCommandState(b.dataset.cmd);
      else if (b.dataset.block && b.dataset.block!=='p') on = block === b.dataset.block;
    }catch(e){}
    b.classList.toggle('on', on);
  });
}

const SHORTCUTS = { '#':['formatBlock','<h1>'], '##':['formatBlock','<h2>'], '###':['formatBlock','<h3>'], '-':['insertUnorderedList'], '*':['insertUnorderedList'], '1.':['insertOrderedList'], '>':['formatBlock','<blockquote>'] };
function markdownShortcut(e){
  if (e.key !== ' ') return;
  const sel = getSelection(); if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0); if (!r.collapsed) return;
  let el = r.startContainer.nodeType===1 ? r.startContainer : r.startContainer.parentElement;
  const block = el.closest('p,div:not(.editor),h1,h2,h3');
  if (!block || !$('editor').contains(block) || block.closest('table')) return;
  const pre = document.createRange(); pre.setStart(block, 0); pre.setEnd(r.startContainer, r.startOffset);
  const marker = pre.toString();
  const act = SHORTCUTS[marker]; if (!act) return;
  e.preventDefault();
  pre.deleteContents();
  if (!block.textContent) block.innerHTML = '<br>';
  const caret = document.createRange(); caret.setStart(block, 0); caret.collapse(true);
  sel.removeAllRanges(); sel.addRange(caret);
  document.execCommand(act[0], false, act[1]);
  scheduleSave();
}

/* ---------- Markdown export ---------- */
function htmlToMd(html){
  const root = document.createElement('div'); root.innerHTML = html;
  const inl = n => [...n.childNodes].map(inlNode).join('');
  function inlNode(c){
    if (c.nodeType===3) return c.textContent.replace(/\s+/g,' ');
    if (c.nodeType!==1) return '';
    const t=c.tagName, s=inl(c);
    if (t==='STRONG'||t==='B') return s.trim()?`**${s.trim()}**`:'';
    if (t==='EM'||t==='I') return s.trim()?`*${s.trim()}*`:'';
    if (t==='BR') return '\n';
    if (t==='A') return `[${s}](${c.getAttribute('href')||''})`;
    return s;
  }
  function list(el, depth){
    let out='', i=1;
    for (const li of el.children){ if (li.tagName!=='LI') continue;
      let text='', nested='';
      li.childNodes.forEach(c => { if (c.nodeType===1 && /^(UL|OL)$/.test(c.tagName)) nested += list(c, depth+1); else text += inlNode(c); });
      out += '  '.repeat(depth) + (el.tagName==='OL' ? (i++)+'. ' : '- ') + text.trim() + '\n' + nested;
    }
    return out;
  }
  function table(t){
    const rows = [...t.querySelectorAll('tr')].map(tr => [...tr.children].map(c => inl(c).trim().replace(/\|/g,'\\|').replace(/\n/g,' ')));
    if (!rows.length) return '';
    const w = Math.max(...rows.map(r=>r.length));
    const line = r => '| ' + Array.from({length:w},(_,i)=>r[i]||'').join(' | ') + ' |';
    return [line(rows[0]), '| ' + Array(w).fill('---').join(' | ') + ' |', ...rows.slice(1).map(line)].join('\n') + '\n';
  }
  function blocks(parent){
    const out=[];
    parent.childNodes.forEach(n => {
      if (n.nodeType===3){ if (n.textContent.trim()) out.push(n.textContent.trim()); return; }
      if (n.nodeType!==1) return;
      const t=n.tagName;
      if (/^H[1-6]$/.test(t)) out.push('#'.repeat(+t[1]) + ' ' + inl(n).trim());
      else if (t==='UL'||t==='OL') out.push(list(n,0).trimEnd());
      else if (t==='TABLE') out.push(table(n).trimEnd());
      else if (t==='BLOCKQUOTE') out.push(inl(n).trim().split('\n').map(l=>'> '+l).join('\n'));
      else if (t==='HR') out.push('---');
      else if (t==='DIV' && (n.classList.contains('tbl-wrap') || n.querySelector('table,ul,ol,h1,h2,h3,p'))) out.push(...blocks(n));
      else { const s = inl(n).trim(); if (s) out.push(s); }
    });
    return out;
  }
  return blocks(root).join('\n\n') + '\n';
}

async function exportMd(){
  const d = state.docs.get(state.currentId); if (!d || !downloads) return;
  const md = `# ${d.title||'Untitled'}\n\n${htmlToMd(d.html||'')}`;
  const name = ((d.title||'untitled').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase() || 'untitled') + '.md';
  try{ await downloads.save({filename:name, data:md}); }
  catch(e){
    if (e && e.code==='declined') return;
    if (e && e.code==='rate_limited') setSave('A download is already waiting for confirmation.');
    else { setSave('Export isn’t available here.', true); $('exportBtn').style.display='none'; }
  }
}

function buildPdf(jsPDF, meta, blocks){
  const clean = s => String(s||'').replace(/[\u2192]/g,'->').replace(/[\u00A0]/g,' ').replace(/[^\x09\x0A\x0D\x20-\x7E\u00A1-\u00FF\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026]/g,'');
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 18, CW = W - M*2, BOTTOM = H - 18;
  const accent = meta.accent ? hexRgb(meta.accent) : meta.type==='prd' ? [45,79,214] : meta.type==='brd' ? [169,106,18] : [70,78,94];
  const ink=[26,33,48], grey=[110,118,134];
  const CORP = meta.theme === 'corporate';
  const HEAD_H = 15;
  function pageHeader(){
    if (!CORP) return M;
    doc.setFillColor(234,237,242); doc.rect(0, 0, W, HEAD_H, 'F');
    doc.setDrawColor(...accent); doc.setLineWidth(0.6); doc.line(0, HEAD_H, W, HEAD_H);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100, 108, 124);
    doc.text(clean((meta.badge ? meta.badge + ' — ' : '') + (meta.title || 'Untitled')), M, HEAD_H/2 + 3.2, {maxWidth: CW - 10});
    return HEAD_H + 10;
  }
  let y = pageHeader();
  if (meta.coverSrc){
    const bh = CW/4; doc.addImage(meta.coverSrc, 'JPEG', M, y, CW, bh); y += bh + 8;
  }
  const lh = pt => pt*0.3528*1.45;
  const need = h => { if (y + h > BOTTOM){ doc.addPage(); y = pageHeader(); } };
  function para(text, {size=10.5, style='normal', color=ink, x=M, width=CW, after=2.2}={}){
    doc.setFont('helvetica', style); doc.setFontSize(size); doc.setTextColor(...color);
    const lines = doc.splitTextToSize(clean(text), width);
    for (const ln of lines){ need(lh(size)); doc.text(ln, x, y + lh(size)*0.75); y += lh(size); }
    y += after;
  }
  // title block (corporate theme skips the accent bar; the letterhead band already carries the accent rule)
  if (!CORP){ doc.setFillColor(...accent); doc.rect(M, y, 14, 1.4, 'F'); y += 6; }
  para(meta.title || 'Untitled', {size:20, style:'bold', after:1.5});
  para([meta.badge, meta.status, 'Updated ' + meta.date].filter(Boolean).join('   |   '), {size:9, color:grey, after:6});
  for (const b of blocks){
    if (b.t==='h'){
      const size = b.level===1 ? 15 : b.level===2 ? 13 : 11.2;
      y += b.level===3 ? 1.5 : 3.5; need(lh(size) + 8);
      if (CORP && b.level===2) para(b.text.toUpperCase(), {size, style:'bold', color:accent, after:1});
      else if (CORP && b.level===3) para(b.text.toUpperCase(), {size:9, style:'bold', color:grey, after:1});
      else para(b.text, {size, style:'bold', after: b.level===2 ? 1 : 1.5});
      if (b.level===2 && !CORP){ doc.setDrawColor(215,219,228); doc.setLineWidth(0.25); doc.line(M, y, M+CW, y); y += 3; }
    } else if (b.t==='p'){ para(b.text); }
    else if (b.t==='li'){
      const ind = M + 4 + b.depth*5;
      const marker = b.ordered ? b.index + '.' : '\u2022';
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(...ink);
      need(lh(10.5)); doc.text(marker, ind, y + lh(10.5)*0.75);
      para(b.text, {x: ind + 5, width: CW - (ind + 5 - M), after:1});
      if (b.last) y += 1.5;
    } else if (b.t==='quote'){
      doc.setFontSize(10.5);
      const lines = doc.splitTextToSize(clean(b.text), CW - 10);
      const h = lines.length*lh(10.5) + 6; need(h);
      doc.setFillColor(accent[0], accent[1], accent[2]); doc.setGState && doc.setGState(new doc.GState({opacity:0.08}));
      doc.rect(M, y, CW, h, 'F'); if (doc.setGState) doc.setGState(new doc.GState({opacity:1}));
      doc.setFillColor(...accent); doc.rect(M, y, 1.2, h, 'F');
      const y0 = y; y += 3; para(b.text, {x:M+6, width:CW-10, after:0}); y = y0 + h + 3;
    } else if (b.t==='table'){
      y += 1;
      doc.autoTable({ startY:y, head: b.head.length ? [b.head.map(clean)] : undefined, body: b.body.map(r=>r.map(clean)),
        margin:{left:M, right:M, top: CORP ? HEAD_H+10 : M, bottom:18}, theme:'grid',
        styles:{font:'helvetica', fontSize:9, cellPadding:2.2, textColor:ink, lineColor:[215,219,228], lineWidth:0.2, overflow:'linebreak', valign:'top'},
        headStyles: CORP ? {fillColor:accent, textColor:[255,255,255], fontStyle:'bold'} : {fillColor:[241,243,247], textColor:ink, fontStyle:'bold'},
        didDrawPage: () => { if (CORP) pageHeader(); } });
      y = doc.lastAutoTable.finalY + 5;
    } else if (b.t==='hr'){ need(6); y += 2; doc.setDrawColor(215,219,228); doc.line(M, y, M+CW, y); y += 4; }
  }
  const n = doc.getNumberOfPages();
  for (let i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...grey);
    doc.text(clean(meta.title||'Untitled'), M, H-10, {maxWidth: CW-30}); doc.text(`Page ${i} of ${n}`, W-M, H-10, {align:'right'}); }
  return doc;
}

function htmlToBlocks(html){
  const root = document.createElement('div'); root.innerHTML = html;
  const txt = n => (n.innerText !== undefined && n.isConnected ? n.innerText : n.textContent).replace(/\s+/g,' ').trim();
  const out = [];
  function list(el, depth){
    const items = [...el.children].filter(c=>c.tagName==='LI'); let i = 1;
    items.forEach((li, k) => {
      let text=''; const nested=[];
      li.childNodes.forEach(c => { if (c.nodeType===1 && /^(UL|OL)$/.test(c.tagName)) nested.push(c); else text += c.textContent; });
      out.push({t:'li', ordered: el.tagName==='OL', index:i++, depth, text:text.replace(/\s+/g,' ').trim(), last: depth===0 && k===items.length-1 && !nested.length});
      nested.forEach(n => list(n, depth+1));
    });
  }
  function walk(parent){
    parent.childNodes.forEach(n => {
      if (n.nodeType===3){ const t=n.textContent.replace(/\s+/g,' ').trim(); if (t) out.push({t:'p', text:t}); return; }
      if (n.nodeType!==1) return;
      const t = n.tagName;
      if (/^H[1-6]$/.test(t)) out.push({t:'h', level: Math.min(+t[1],3), text: txt(n)});
      else if (t==='UL'||t==='OL') list(n, 0);
      else if (t==='TABLE'){
        const rows = [...n.querySelectorAll('tr')].map(tr => [...tr.children].map(c => c.textContent.replace(/\s+/g,' ').trim()));
        const hasHead = n.tHead && n.tHead.rows.length;
        out.push({t:'table', head: hasHead ? rows[0] : [], body: hasHead ? rows.slice(1) : rows});
      }
      else if (t==='BLOCKQUOTE') out.push({t:'quote', text: n.textContent.replace(/\s+/g,' ').trim()});
      else if (t==='HR') out.push({t:'hr'});
      else if (t==='DIV' && n.querySelector('table,ul,ol,h1,h2,h3,p,blockquote')) walk(n);
      else { const s = n.textContent.replace(/\s+/g,' ').trim(); if (s) out.push({t:'p', text:s}); }
    });
  }
  walk(root);
  return out;
}

async function exportPdf(){
  const d = state.docs.get(state.currentId); if (!d || !downloads || !window.jspdf) return;
  flushSave();
  const btn = $('pdfBtn'); btn.disabled = true; btn.textContent = 'Preparing…';
  try{
    const look = lookOf(d);
    const pdf = buildPdf(window.jspdf.jsPDF, { title:d.title, type:d.type, badge:TEMPLATES[d.type].label, status:d.status||'Draft',
      accent: look.accent, theme: look.theme, coverSrc: coverSrc(d.cover),
      date:new Date(d.updatedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) }, htmlToBlocks(d.html||''));
    const name = ((d.title||'untitled').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').toLowerCase() || 'untitled') + '.pdf';
    await downloads.save({ filename:name, data: pdf.output('blob') });
  }catch(e){
    if (!(e && e.code==='declined')){
      if (e && e.code==='rate_limited') setSave('A download is already waiting for confirmation.');
      else setSave('PDF export failed. Try again, or use Markdown.', true);
    }
  }finally{ btn.disabled = false; btn.textContent = 'Export PDF'; }
}

/* ---------- Actions ---------- */
function createDoc(type){
  pickedOnce = true;
  const t = TEMPLATES[type]; const now = Date.now();
  const doc = { id:uid(), type, title: t.title, html: typeof t.html==='function' ? t.html().trim() : t.html, status:'Draft',
    cover: DEFAULT_COVER[type] || null, design: { ...DEFAULT_DESIGN, theme: DEFAULT_THEME[type] || DEFAULT_DESIGN.theme }, createdAt:now, updatedAt:now };
  state.docs.set(doc.id, doc); state.currentId = doc.id; state.view = 'doc';
  render(); persist({...doc}); closeDrawer();
  const title = $('title'); if (title){ title.focus(); if (type!=='blank') title.select(); }
}

let armTimer=null;
async function deleteDoc(){
  const btn = $('deleteBtn');
  if (!btn.classList.contains('armed')){
    btn.classList.add('armed'); btn.textContent='Confirm delete';
    clearTimeout(armTimer); armTimer = setTimeout(()=>{ btn.classList.remove('armed'); btn.textContent='Delete'; }, 3500);
    return;
  }
  clearTimeout(armTimer); btn.classList.remove('armed'); btn.textContent='Delete';
  const id = state.currentId; clearTimeout(saveTimer);
  state.docs.delete(id); delete writers[id];
  const next = sortedDocs()[0];
  state.currentId = next ? next.id : null; state.view = next ? 'doc' : 'picker';
  render();
  try{ await backend.remove(id); setSave('Deleted'); }catch(e){ setSave('Couldn’t delete. Reload and try again.', true); }
}

function openDrawer(){ $('app').classList.add('drawer'); }
function closeDrawer(){ $('app').classList.remove('drawer'); }

$('newBtn').addEventListener('click', () => { pickedOnce = true; flushSave(); state.view='picker'; state.currentId=null; render(); closeDrawer(); });
$('docList').addEventListener('click', e => { const b = e.target.closest('.doc-item'); if (!b) return; flushSave(); state.currentId=b.dataset.id; state.view='doc'; render(); closeDrawer(); });
$('scroller').addEventListener('click', e => { const t = e.target.closest('[data-tpl]'); if (t) createDoc(t.dataset.tpl); });
$('search').addEventListener('input', e => { state.query = e.target.value; renderList(); });
$('status').addEventListener('change', e => { const d = state.docs.get(state.currentId); if (!d) return; d.status = e.target.value; d.updatedAt = Date.now(); persist({...d}); renderList(); });
$('deleteBtn').addEventListener('click', deleteDoc);
$('designBtn').addEventListener('click', openDesignPicker);
$('exportBtn').addEventListener('click', exportMd);
$('pdfBtn').addEventListener('click', exportPdf);
$('menuBtn').addEventListener('click', openDrawer);
$('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key==='Escape') closeDrawer(); });

function flushSave(){
  if (!saveTimer) return; clearTimeout(saveTimer); saveTimer=null;
  const d = state.docs.get(state.currentId); if (d && $('editor')){ d.title=$('title').value; d.html=$('editor').innerHTML; persist({...d}); }
}
setInterval(() => { if (state.view==='doc') { renderList(); updateMeta(); } }, 60000);

initStore();
